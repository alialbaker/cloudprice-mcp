name: Security checks

# Runs on every PR and on pushes to main. All tooling here is open source and
# free on private repositories - GitHub's own secret scanning and CodeQL are
# paid for private repos (GitHub Secret Protection / Code Security), so these
# are the equivalents that cost nothing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. Individual jobs raise this only if they must.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a full commit SHA, not a tag. A tag is
      # mutable: in March 2026 attackers force-pushed 75 of 76 trivy-action
      # tags and exfiltrated secrets from every pipeline that used one.
      # Dependabot keeps these SHAs current - see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config; it can leak
          # through uploaded artifacts (zizmor: artipacked).
          persist-credentials: false
          # Full history so gitleaks can scan past commits, not just the tip.
          fetch-depth: 0

      # The gitleaks binary rather than gitleaks-action: the action requires a
      # paid licence for organisations, the binary does not.
      # Pinned version AND verified checksum. Pulling a tool into CI without
      # verifying it is the same class of problem as an unpinned action -
      # zizmor flags it as adhoc-packages. The hash is from the project's
      # published checksums.txt for this exact release.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan repository history
        run: gitleaks detect --source . --redact --verbose --no-banner

  actions-lint:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config; it can leak
          # through uploaded artifacts (zizmor: artipacked).
          persist-credentials: false

      # zizmor is static analysis for the workflows themselves: template
      # injection, credential leaks, over-broad permissions, unpinned actions.
      # The CI config is part of the attack surface, not just the app.
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Uploads SARIF to GitHub code scanning, which is what puts findings
          # inline on the diff instead of leaving them as run annotations.
          # Free on public repositories; private repos need the paid Code
          # Security product, so this stays false there.
          advanced-security: true
          persona: regular
          # Fail the build on medium and above; report low/help findings
          # without blocking. The remaining low-severity items are inline
          # `pip install` calls in the existing cloud deploy workflows -
          # real, worth pinning eventually, but not worth blocking every PR
          # on while they are the lowest severity zizmor reports.
          min-severity: medium

  iac:
    name: Infrastructure scan (Checkov + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave GITHUB_TOKEN in .git/config; it can leak
          # through uploaded artifacts (zizmor: artipacked).
          persist-credentials: false

      - name: Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          # Scan every .tf in the repo, not one directory - this repo has
          # Terraform in more than one place.
          directory: .
          framework: terraform
          # Start non-blocking so the first run inventories what is wrong
          # rather than blocking every PR on day one.
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      # tfsec is deprecated - its engine now lives in Trivy, so `trivy config`
      # is the current way to get that ruleset.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Publish Checkov findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: checkov.sarif
          category: checkov
